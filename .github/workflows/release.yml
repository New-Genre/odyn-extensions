# After a merge to main: releases every extension whose version went up, then
# commits the updated index.json (the list Odyn reads) and .github/CODEOWNERS
# (who reviews changes to each extension, from its `odyn.owners`).
name: Release

on:
  push:
    branches: [main]
    paths:
      - "extensions/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # main only accepts reviewed changes; this deploy key is the one thing
          # allowed to save the updated list and owners file straight to it.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node scripts/release.mjs --publish
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/owners.mjs
      - name: Commit the updated list and owners
        run: |
          if git diff --quiet -- index.json .github/CODEOWNERS; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.json .github/CODEOWNERS
          git commit -m "Update index.json and owners"
          git push
